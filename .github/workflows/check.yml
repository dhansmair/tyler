# What the pre-commit hook checks (`make check`: format, SwiftLint, test paths and the tests), in a
# fresh checkout, for every pull request that isn't a draft and every push to main. A draft runs it
# once it is marked ready for review. A pull request that changes only Markdown skips it.
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether `check` runs. Not `paths-ignore`: `check` is a required status, and a workflow
  # that never starts leaves it pending for good, while a skipped job counts as passed.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select((.filename | endswith(".md") | not) or ((.previous_filename // "x.md") | endswith(".md") | not)) | .filename')
          echo "Changed files that aren't Markdown:"
          echo "${others:-(none)}"
          if [ -n "$others" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The SwiftLint the maintainer runs, pinned by checksum.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          curl -sSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: |
          xcode-select -p
          swift --version
          swiftlint version

      - name: make check
        run: |
          # SwiftLint needs the selected Xcode's sourcekitd, not the Command Line Tools' default.
          export TOOLCHAIN_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          make check
