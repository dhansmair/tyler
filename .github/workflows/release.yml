# A pushed tag v<version> makes the GitHub release, with the version's CHANGELOG.md entry as its
# notes. The tag must name the version TylerVersion says, and the release must build. Releases ship as source (devdocs/design.md,
# Releases), so nothing is attached beyond GitHub's own source archives.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Release notes
        run: devtools/release-notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - name: Build the release
        run: make release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "tyler ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
