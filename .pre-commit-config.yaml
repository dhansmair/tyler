# Mirrors the checks in devdocs/coding-guidelines.md. Install with `pre-commit install`.
# The first failing hook stops the run, so a formatting fix doesn't wait for the tests.
fail_fast: true
repos:
  - repo: local
    hooks:
      # Runs on every text file, docs included: the Swift checks skip a commit without Swift files.
      - id: conflict-markers
        name: no conflict markers
        entry: bash -c '! grep -nE "^(<<<<<<<|>>>>>>>)( |$)" "$@"' --
        language: system
        types: [text]

      # Changing a file fails the commit and leaves the fix in the working tree to stage.
      - id: swift-format-fix
        name: swift format
        entry: swift format --in-place
        language: system
        types: [swift]

      # What formatting can't fix, such as a line it can't break.
      - id: swift-format
        name: swift format lint
        entry: swift format lint --strict
        language: system
        types: [swift]

      - id: swiftlint
        name: swiftlint
        # Fails (instead of skipping) when swiftlint is missing, so a green run never hides an
        # unrun check. TOOLCHAIN_DIR points SwiftLint at the Command Line Tools' sourcekitd; without
        # it SwiftLint crashes on machines that have no full Xcode.
        entry: >-
          bash -c 'command -v swiftlint >/dev/null || { echo "swiftlint is not installed (brew install swiftlint)"; exit 1; };
          TOOLCHAIN_DIR="${TOOLCHAIN_DIR:-/Library/Developer/CommandLineTools}" swiftlint --strict --quiet "$@"' --
        language: system
        types: [swift]
        require_serial: true

      - id: test-paths
        name: tests mirror sources
        # Over the whole tree: renaming a source file can strand the tests named after it.
        entry: devtools/check-test-paths
        language: system
        types: [swift]
        pass_filenames: false

      - id: swift-test
        name: swift test
        entry: make test
        language: system
        types: [swift]
        pass_filenames: false
