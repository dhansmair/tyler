excluded:
  - .build

# swift-format (the formatter) requires trailing commas in multi-line collections, while
# SwiftLint forbids them by default. Make SwiftLint agree with the formatter.
trailing_comma:
  mandatory_comma: true

# `fd` is the standard name for a file descriptor, and `id` is what `Identifiable` requires.
# docs/coding-guidelines.md allows widely known abbreviations, but SwiftLint's default minimum
# length of 3 would flag them.
identifier_name:
  excluded:
    - fd
    - id
